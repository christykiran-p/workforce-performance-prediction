[project]
name = "workforce-performance-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "duckdb>=1.5.3",
    "faiss-cpu>=1.14.3",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.4",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.2",
    "numpy>=2.2.6",
    "ollama>=0.6.2",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "pymysql>=1.2.0",
    "pypdf>=6.12.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.7.2",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.57.0",
    "tiktoken>=0.13.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
